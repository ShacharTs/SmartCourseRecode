<svg width="360" height="820"
    viewBox="0 0 360 820"
    xmlns="http://www.w3.org/2000/svg">

    <defs>
        <style>
            /* SURFACES */
            .card { fill:#171122; }
            .card-elevated { fill:#241636; }
            .accent { fill:#3A0F54; }

            /* TEXT */
            .white { fill:#FFFFFF; }
            .sub { fill:#A9A9B3; }
            .bold { font-weight:700; }
            .semi { font-weight:600; }
            .rate { fill:#FFD54F; }

            /* BUTTONS */
            .btn-primary { fill:#EC4899; }
            .btn-secondary { fill:#171122; stroke:#3A0F54; stroke-width:1; }
        </style>

        <!-- DARK MODE GRADIENT (GLOBAL) -->
        <linearGradient id="bgDark" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#0B0514"/>
            <stop offset="50%" stop-color="#1E0938"/>
            <stop offset="100%" stop-color="#3A0F54"/>
        </linearGradient>
    </defs>

    <!-- BACKGROUND -->
    <rect width="360" height="820" fill="url(#bgDark)"/>

    <g transform="translate(16,0)">

        <!-- MY STUDENTS -->
        <text x="0" y="42" class="white bold" font-size="26">
            My Students
        </text>

        <g transform="translate(0,66)">
            <g>
                <rect width="100" height="150" rx="12" class="card"/>
                <circle cx="50" cy="46" r="26" class="accent"/>
                <text x="50" y="96" text-anchor="middle"
                    class="white semi" font-size="16">Dana</text>
                <text x="50" y="118" text-anchor="middle"
                    class="sub" font-size="14">Math</text>
            </g>

            <g transform="translate(120,0)">
                <rect width="100" height="150" rx="12" class="card"/>
                <circle cx="50" cy="46" r="26" class="accent"/>
                <text x="50" y="96" text-anchor="middle"
                    class="white semi" font-size="16">Ron</text>
                <text x="50" y="118" text-anchor="middle"
                    class="sub" font-size="14">Physics</text>
            </g>

            <g transform="translate(240,0)">
                <rect width="100" height="150" rx="12" class="card"/>
                <circle cx="50" cy="46" r="26" class="accent"/>
                <text x="50" y="96" text-anchor="middle"
                    class="white semi" font-size="16">Alex</text>
                <text x="50" y="118" text-anchor="middle"
                    class="sub" font-size="14">Chem</text>
            </g>
        </g>

        <!-- DISCOVER -->
        <text x="0" y="246" class="white bold" font-size="26">
            Students Seeking Help
        </text>

        <g transform="translate(0,270)">

            <!-- COLUMN 1 -->
            <g>
                <g>
                    <rect width="156" height="120" rx="14" class="card"/>
                    <circle cx="24" cy="28" r="16" class="accent"/>
                    <text x="50" y="26" class="white semi" font-size="14">Dana</text>
                    <text x="50" y="44" class="sub" font-size="12">Linear Algebra</text>
                    <text x="50" y="60" class="rate" font-size="12">★ 4.9</text>

                    <rect x="12" y="74" width="60" height="30" rx="8" class="btn-primary"/>
                    <text x="42" y="94" text-anchor="middle"
                        class="white semi" font-size="12">Chat</text>

                    <rect x="84" y="74" width="60" height="30" rx="8" class="btn-secondary"/>
                    <text x="114" y="94" text-anchor="middle"
                        class="white semi" font-size="12">Save</text>
                </g>

                <g transform="translate(0,136)">
                    <rect width="156" height="120" rx="14" class="card"/>
                    <circle cx="24" cy="28" r="16" class="accent"/>
                    <text x="50" y="26" class="white semi" font-size="14">Alex</text>
                    <text x="50" y="44" class="sub" font-size="12">Organic Chem</text>
                    <text x="50" y="60" class="rate" font-size="12">★ 4.8</text>

                    <rect x="12" y="74" width="60" height="30" rx="8" class="btn-primary"/>
                    <text x="42" y="94" text-anchor="middle"
                        class="white semi" font-size="12">Chat</text>

                    <rect x="84" y="74" width="60" height="30" rx="8" class="btn-secondary"/>
                    <text x="114" y="94" text-anchor="middle"
                        class="white semi" font-size="12">Save</text>
                </g>
            </g>

            <!-- COLUMN 2 -->
            <g transform="translate(172,0)">
                <g>
                    <rect width="156" height="120" rx="14" class="card"/>
                    <circle cx="24" cy="28" r="16" class="accent"/>
                    <text x="50" y="26" class="white semi" font-size="14">Ron</text>
                    <text x="50" y="44" class="sub" font-size="12">Quantum Physics</text>
                    <text x="50" y="60" class="rate" font-size="12">★ 4.6</text>

                    <rect x="12" y="74" width="60" height="30" rx="8" class="btn-primary"/>
                    <text x="42" y="94" text-anchor="middle"
                        class="white semi" font-size="12">Chat</text>

                    <rect x="84" y="74" width="60" height="30" rx="8" class="btn-secondary"/>
                    <text x="114" y="94" text-anchor="middle"
                        class="white semi" font-size="12">Save</text>
                </g>

                <g transform="translate(0,136)">
                    <rect width="156" height="120" rx="14" class="card"/>
                    <circle cx="24" cy="28" r="16" class="accent"/>
                    <text x="50" y="26" class="white semi" font-size="14">Ben</text>
                    <text x="50" y="44" class="sub" font-size="12">Biology</text>
                    <text x="50" y="60" class="rate" font-size="12">★ 4.7</text>

                    <rect x="12" y="74" width="60" height="30" rx="8" class="btn-primary"/>
                    <text x="42" y="94" text-anchor="middle"
                        class="white semi" font-size="12">Chat</text>

                    <rect x="84" y="74" width="60" height="30" rx="8" class="btn-secondary"/>
                    <text x="114" y="94" text-anchor="middle"
                        class="white semi" font-size="12">Save</text>
                </g>
            </g>
        </g>

        <!-- LATEST CHATS -->
        <text x="0" y="560" class="white bold" font-size="26">
            Latest Chats
        </text>

        <g transform="translate(0,584)">
            <g>
                <rect width="328" height="50" rx="10" class="card"/>
                <circle cx="26" cy="25" r="14" class="accent"/>
                <text x="50" y="32" class="white" font-size="15">
                    Dana — Tomorrow works
                </text>
            </g>

            <g transform="translate(0,60)">
                <rect width="328" height="50" rx="10" class="card"/>
                <circle cx="26" cy="25" r="14" class="accent"/>
                <text x="50" y="32" class="white" font-size="15">
                    Ron — Sent the exercises
                </text>
            </g>

            <g transform="translate(0,120)">
                <rect width="328" height="50" rx="10" class="card"/>
                <circle cx="26" cy="25" r="14" class="accent"/>
                <text x="50" y="32" class="white" font-size="15">
                    Alex — See you at 5
                </text>
            </g>
        </g>

    </g>
</svg>
