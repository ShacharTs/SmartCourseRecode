<svg width="360" height="800"
    viewBox="0 0 360 800"
    xmlns="http://www.w3.org/2000/svg">

    <defs>
        <style>
            .title { font:700 22px system-ui; fill:#111827; }
            .section { font:600 16px system-ui; fill:#111827; }
            .row { font:14px system-ui; fill:#374151; }
        </style>

        <!-- Light background gradient -->
        <linearGradient id="bgLight" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#9333EA"/>
            <stop offset="50%" stop-color="#EC4899"/>
            <stop offset="100%" stop-color="#F97316"/>
        </linearGradient>
    </defs>

    <!-- Background -->
    <rect width="360" height="800" fill="url(#bgLight)"/>

    <!-- Compact Header -->
    <rect width="360" height="72" fill="#EDE9FE"/>
    <text x="180" y="46" text-anchor="middle" class="title">
        Settings
    </text>

    <!-- CONTENT -->
    <g transform="translate(16,100)">

        <!-- ACCOUNT -->
        <text class="section">Account</text>
        <rect y="12" width="328" height="92" rx="18" fill="#FFFFFF"/>

        <g transform="translate(16,32)">
            <text class="row">Edit Profile</text>
            <text x="292" y="0" font-size="18" fill="#9CA3AF">›</text>
        </g>

        <g transform="translate(16,64)">
            <text class="row">Delete Account</text>
            <text x="292" y="0" font-size="18" fill="#DC2626">›</text>
        </g>

        <!-- NOTIFICATIONS -->
        <g transform="translate(0,124)">
            <text class="section">Notifications</text>
            <rect y="12" width="328" height="92" rx="18" fill="#FFFFFF"/>

            <g transform="translate(16,32)">
                <text class="row">Chat Notifications</text>
                <rect x="260" y="-10" width="36" height="16" rx="8" fill="#DDD6FE"/>
                <circle cx="276" cy="-2" r="6" fill="#7C3AED"/>
            </g>

            <g transform="translate(16,64)">
                <text class="row">App Notifications</text>
                <rect x="260" y="-10" width="36" height="16" rx="8" fill="#E5E7EB"/>
                <circle cx="268" cy="-2" r="6" fill="#9CA3AF"/>
            </g>
        </g>

        <!-- PREFERENCES -->
        <g transform="translate(0,248)">
            <text class="section">Preferences</text>
            <rect y="12" width="328" height="92" rx="18" fill="#FFFFFF"/>

            <g transform="translate(16,32)">
                <text class="row">Theme</text>
                <text x="292" y="0" font-size="18" fill="#9CA3AF">›</text>
            </g>

            <g transform="translate(16,64)">
                <text class="row">Language</text>
                <text x="292" y="0" font-size="18" fill="#9CA3AF">›</text>
            </g>
        </g>

        <!-- SUPPORT -->
        <g transform="translate(0,372)">
            <text class="section">Support</text>
            <rect y="12" width="328" height="92" rx="18" fill="#FFFFFF"/>

            <g transform="translate(16,32)">
                <text class="row">Help  FAQ</text>
                <text x="292" y="0" font-size="18" fill="#9CA3AF">›</text>
            </g>

            <g transform="translate(16,64)">
                <text class="row">Send Feedback</text>
                <text x="292" y="0" font-size="18" fill="#9CA3AF">›</text>
            </g>
        </g>

        <!-- ABOUT -->
        <g transform="translate(0,496)">
            <text class="section">About</text>
            <rect y="12" width="328" height="92" rx="18" fill="#FFFFFF"/>

            <g transform="translate(16,32)">
                <text class="row">Terms  Privacy</text>
                <text x="292" y="0" font-size="18" fill="#9CA3AF">›</text>
            </g>

            <g transform="translate(16,64)">
                <text class="row">App Version</text>
                <text x="250" y="0" font-size="14" fill="#9CA3AF">1.0.0</text>
            </g>
        </g>

        <!-- LOG OUT -->
        <g transform="translate(0,620)">
            <rect width="328" height="52" rx="18" fill="#FFFFFF"/>
            <text x="164" y="34"
                text-anchor="middle"
                font-size="16"
                fill="#DC2626"
                font-family="system-ui,sans-serif">
                Log out
            </text>
        </g>

    </g>
</svg>
