<svg width="360" height="800"
    viewBox="0 0 360 800"
    xmlns="http://www.w3.org/2000/svg">

    <defs>
        <style>
            .name { font:700 22px system-ui; fill:#111827; }
            .sub { font:14px system-ui; fill:#6B7280; }
            .section { font:600 16px system-ui; fill:#111827; }
            .body { font:14px system-ui; fill:#374151; }
            .chip { font:12px system-ui; fill:#9333EA; }
        </style>

        <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#9333EA"/>
            <stop offset="50%" stop-color="#EC4899"/>
            <stop offset="100%" stop-color="#F97316"/>
        </linearGradient>
    </defs>

    <!-- Background -->
    <rect width="360" height="800" fill="url(#bg)"/>

    <g transform="translate(20,32)">

        <!-- Back -->
        <text x="0" y="12"
            font-size="18"
            fill="#6B7280"
            dominant-baseline="middle">
            &lt;
        </text>

        <!-- Avatar -->
        <rect x="110" y="32" width="100" height="100" rx="24" fill="#F3E8FF"/>

        <!-- Name -->
        <text x="160" y="160"
            text-anchor="middle"
            dominant-baseline="middle"
            class="name">
            Angela Taylor
        </text>

        <!-- Subtitle -->
        <text x="160" y="186"
            text-anchor="middle"
            dominant-baseline="middle"
            class="sub">
            Math  Physics Tutor
        </text>

        <!-- Chips -->
        <g transform="translate(0,212)">
            <rect width="320" height="48" rx="16" fill="#FFFFFF"/>
            <text x="20" y="24" dominant-baseline="middle" class="chip">Math</text>
            <text x="80" y="24" dominant-baseline="middle" class="chip">Physics</text>
            <text x="160" y="24" dominant-baseline="middle" class="chip">Calculus</text>
        </g>

        <!-- About -->
        <g transform="translate(0,280)">
            <text class="section">About</text>
            <rect y="12" width="320" height="96" rx="18" fill="#FFFFFF"/>

            <text x="16" y="36" dominant-baseline="middle" class="body">
                Passionate tutor with 6+ years
            </text>
            <text x="16" y="58" dominant-baseline="middle" class="body">
                of experience helping students
            </text>
            <text x="16" y="80" dominant-baseline="middle" class="body">
                master complex topics.
            </text>
        </g>

        <!-- Details -->
        <g transform="translate(0,404)">
            <text class="section">Details</text>
            <rect y="12" width="320" height="84" rx="18" fill="#FFFFFF"/>

            <text x="16" y="36" dominant-baseline="middle" class="body">
                Experience: 6 years
            </text>
            <text x="16" y="58" dominant-baseline="middle" class="body">
                Language: English
            </text>
            <text x="16" y="80" dominant-baseline="middle" class="body">
                Level: High school &amp; College
            </text>
        </g>

        <!-- Action -->
        <g transform="translate(0,520)">
            <rect width="320" height="52" rx="18" fill="#9333EA"/>
            <text x="160" y="26"
                text-anchor="middle"
                dominant-baseline="middle"
                font-size="16"
                font-weight="600"
                fill="#FFFFFF">
                Contact Tutor
            </text>
        </g>

    </g>
</svg>
