<svg width="360" height="64" viewBox="0 0 360 64"
    xmlns="http://www.w3.org/2000/svg">

    <defs>
        <style>
            /* =========================
            DARK APP BAR THEME
            ========================= */

            .bg {
            fill: #16112A; /* same as chat top bar */
            }

            .icon {
            fill: #A9A9B3;
            }

            .title {
            fill: #FFFFFF;
            font-family: system-ui, sans-serif;
            font-size: 18px;
            font-weight: 600;
            }
        </style>
    </defs>

    <!-- =========================
         APP BAR BACKGROUND
         ========================= -->
    <rect width="360" height="64" class="bg"/>

    <!-- =========================
         LEFT ICON (SETTINGS)
         ========================= -->
    <g transform="translate(16,20)">
        <!-- Gear icon (Material-style) -->
        <path class="icon"
            d="M12 8.5a3.5 3.5 0 1 0 0 7a3.5 3.5 0 0 0 0-7zm7.4 3.5c0-.5-.05-1-.15-1.5l1.8-1.4-1.7-2.9-2.1.8a7.8 7.8 0 0 0-2.6-1.5L12 1.5L9.35 5.5a7.8 7.8 0 0 0-2.6 1.5l-2.1-.8-1.7 2.9 1.8 1.4c-.1.5-.15 1-.15 1.5s.05 1 .15 1.5l-1.8 1.4 1.7 2.9 2.1-.8c.8.6 1.7 1.1 2.6 1.5L12 22.5l2.65-4a7.8 7.8 0 0 0 2.6-1.5l2.1.8 1.7-2.9-1.8-1.4c.1-.5.15-1 .15-1.5z"/>
    </g>

    <!-- =========================
         TITLE (CENTERED)
         ========================= -->
    <text x="180" y="40"
        text-anchor="middle"
        class="title">
        Welcome Shachar
    </text>

    <!-- =========================
         RIGHT ICON (LOGOUT)
         ========================= -->
    <g transform="translate(320,20)">
        <!-- Logout icon -->
        <path class="icon"
            d="M10 3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h6v-2H4V5h6V3zm7.6 8l-4.3-4.3l-1.4 1.4L14.8 11l-2.9 2.9l1.4 1.4L17.6 11z"/>
    </g>

</svg>
