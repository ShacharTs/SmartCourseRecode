<svg width="360" height="80" viewBox="0 0 360 80"
    xmlns="http://www.w3.org/2000/svg">

    <defs>
        <style>
            /* =========================
            DARK NAV BAR THEME
            ========================= */

            .bg {
            fill: #16112A; /* chat/input surface */
            }

            .item-label {
            font-family: system-ui, sans-serif;
            font-size: 12px;
            }

            .icon {
            fill: #A9A9B3;
            }

            .label {
            fill: #A9A9B3;
            }

            .icon-selected {
            fill: #EC4899;
            }

            .label-selected {
            fill: #EC4899;
            font-weight: 600;
            }
        </style>
    </defs>

    <!-- =========================
         BACKGROUND
         ========================= -->
    <rect width="360" height="80" class="bg"/>

    <!-- =========================
         HOME (SELECTED)
         ========================= -->
    <g transform="translate(60,12)">
        <path class="icon-selected"
            d="M12 3l9 8h-3v8h-4v-5h-4v5H6v-8H3z"/>
        <text x="12" y="44" text-anchor="middle"
            class="item-label label-selected">
            Home
        </text>
    </g>

    <!-- =========================
         CHAT
         ========================= -->
    <g transform="translate(168,12)">
        <path class="icon"
            d="M4 4h16v10H7l-3 3V4z"/>
        <text x="12" y="44" text-anchor="middle"
            class="item-label label">
            Chat
        </text>
    </g>

    <!-- =========================
         SEARCH
         ========================= -->
    <g transform="translate(276,12)">
        <circle cx="10" cy="10" r="6"
            stroke="#A9A9B3" stroke-width="2" fill="none"/>
        <line x1="14" y1="14" x2="20" y2="20"
            stroke="#A9A9B3" stroke-width="2"/>
        <text x="12" y="44" text-anchor="middle"
            class="item-label label">
            Search
        </text>
    </g>

</svg>
