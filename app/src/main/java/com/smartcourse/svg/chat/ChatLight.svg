<svg width="360" height="800"
    viewBox="0 0 360 800"
    xmlns="http://www.w3.org/2000/svg">

    <defs>
        <style>
            .title { fill:#111827; font-size:16px; font-weight:600; }
            .msg-me { fill:#FFFFFF; font-size:14px; }
            .msg-other { fill:#374151; font-size:14px; }
            .placeholder { fill:#6B7280; font-size:14px; }
        </style>

        <!-- Light background -->
        <linearGradient id="bgLight" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#9333EA"/>
            <stop offset="50%" stop-color="#EC4899"/>
            <stop offset="100%" stop-color="#F97316"/>
        </linearGradient>
    </defs>

    <!-- Background -->
    <rect width="360" height="800" fill="url(#bgLight)"/>

    <!-- TOP BAR -->
    <rect width="360" height="64" fill="#FFFFFF"/>

    <!-- Back -->
    <text x="16" y="40" fill="#6B7280" font-size="20">&lt;</text>

    <!-- Avatar -->
    <circle cx="56" cy="32" r="16" fill="#F3E8FF"/>

    <!-- Name -->
    <text x="80" y="40" class="title">Angela Taylor</text>

    <!-- MESSAGES -->
    <g transform="translate(12,80)">

        <!-- Other -->
        <rect width="240" height="48" rx="16" fill="#FFFFFF"/>
        <text x="12" y="30" class="msg-other">
            Hi! Are you available today?
        </text>

        <!-- Me -->
        <g transform="translate(108,64)">
            <rect width="240" height="48" rx="16" fill="#9333EA"/>
            <text x="12" y="30" class="msg-me">
                Yes, sure
            </text>
        </g>

        <!-- Other -->
        <g transform="translate(0,128)">
            <rect width="240" height="64" rx="16" fill="#FFFFFF"/>
            <text x="12" y="30" class="msg-other">
                Great! Can we start at 6pm?
            </text>
        </g>

        <!-- Me -->
        <g transform="translate(108,208)">
            <rect width="240" height="48" rx="16" fill="#9333EA"/>
            <text x="12" y="30" class="msg-me">
                Works for me
            </text>
        </g>

    </g>

    <!-- INPUT BAR -->
    <rect y="720" width="360" height="80" fill="#FFFFFF"/>

    <!-- Attach -->
    <circle cx="24" cy="760" r="12" fill="#E5E7EB"/>

    <!-- Text field -->
    <rect x="48" y="740" width="236" height="40" rx="20" fill="#F3E8FF"/>
    <text x="64" y="766" class="placeholder">
        Message
    </text>

    <!-- Send -->
    <circle cx="320" cy="760" r="14" fill="#9333EA"/>

</svg>
