<svg width="420" height="720" viewBox="0 0 420 720" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="420" height="720" fill="#121826"/>

    <!-- Top Bar -->
    <rect x="0" y="0" width="420" height="64" fill="#1C2333"/>
    <text x="24" y="40" fill="#FFFFFF" font-size="20" font-weight="bold">
        Posts
    </text>

    <!-- My Post Button -->
    <rect x="290" y="18" rx="12" ry="12" width="110" height="32" fill="#4CAF50"/>
    <text x="345" y="40" text-anchor="middle" fill="#FFFFFF" font-size="13">
        My Post
    </text>

    <!-- Post Card 1 -->
    <rect x="16" y="90" rx="16" ry="16" width="388" height="150" fill="#1F2A44"/>

    <!-- Avatar -->
    <circle cx="44" cy="118" r="14" fill="#4CAF50"/>
    <text x="68" y="123" fill="#FFFFFF" font-size="14" font-weight="bold">
        Student • Algorithms
    </text>

    <!-- Tags -->
    <rect x="24" y="140" rx="10" ry="10" width="90" height="26" fill="#2E7DFF"/>
    <text x="69" y="158" text-anchor="middle" fill="#FFFFFF" font-size="12">
        Algorithms
    </text>

    <rect x="120" y="140" rx="10" ry="10" width="70" height="26" fill="#2E7DFF"/>
    <text x="155" y="158" text-anchor="middle" fill="#FFFFFF" font-size="12">
        Java
    </text>

    <!-- Description -->
    <text x="24" y="190" fill="#D0D4E0" font-size="12">
        Looking for a tutor to help prepare for the final exam.
    </text>

    <!-- Action Button -->
    <rect x="280" y="205" rx="12" ry="12" width="96" height="28" fill="#4CAF50"/>
    <text x="328" y="225" text-anchor="middle" fill="#FFFFFF" font-size="12">
        View
    </text>

    <!-- Post Card 2 -->
    <rect x="16" y="260" rx="16" ry="16" width="388" height="150" fill="#1F2A44"/>

    <!-- Avatar -->
    <circle cx="44" cy="288" r="14" fill="#FFC107"/>
    <text x="68" y="293" fill="#FFFFFF" font-size="14" font-weight="bold">
        Tutor • Python
    </text>

    <!-- Tags -->
    <rect x="24" y="310" rx="10" ry="10" width="80" height="26" fill="#FF9800"/>
    <text x="64" y="328" text-anchor="middle" fill="#FFFFFF" font-size="12">
        Python
    </text>

    <rect x="110" y="310" rx="10" ry="10" width="120" height="26" fill="#FF9800"/>
    <text x="170" y="328" text-anchor="middle" fill="#FFFFFF" font-size="12">
        Data Structures
    </text>

    <!-- Description -->
    <text x="24" y="360" fill="#D0D4E0" font-size="12">
        CS tutor offering online lessons, flexible schedule.
    </text>

    <!-- Action Button -->
    <rect x="280" y="375" rx="12" ry="12" width="96" height="28" fill="#FFC107"/>
    <text x="328" y="395" text-anchor="middle" fill="#1E1E1E" font-size="12">
        View
    </text>

</svg>
