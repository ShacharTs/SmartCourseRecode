<svg width="360" height="800" viewBox="0 0 360 800"
    xmlns="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink">

    <defs>
        <style>
            .text-main { fill:#111827; font-family:system-ui,sans-serif; }
            .text-sub { fill:#4B5563; font-family:system-ui,sans-serif; }
            .text-error { fill:#DC2626; font-weight:800; }
            .primary { fill:#9333EA; }
            .bold { font-weight:700; }
        </style>

        <linearGradient id="bgLight" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#9333EA"/>
            <stop offset="50%" stop-color="#EC4899"/>
            <stop offset="100%" stop-color="#F97316"/>
        </linearGradient>

        <linearGradient id="btnLight" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#9333EA"/>
            <stop offset="100%" stop-color="#F97316"/>
        </linearGradient>

        <g id="googleIconLight">
            <rect width="20" height="20" rx="4" fill="none" stroke="#6B7280"/>
            <text x="10" y="14" text-anchor="middle"
                font-size="10" fill="#374151">G</text>
        </g>

        <g id="logoLight">
            <rect width="180" height="180" rx="24" fill="#FFFFFF"/>
            <text x="90" y="105" text-anchor="middle"
                class="primary bold" font-size="20">LOGO</text>
        </g>
    </defs>

    <rect width="360" height="800" rx="18" fill="url(#bgLight)"/>

    <g transform="translate(24,24)">
        <text x="156" y="20" text-anchor="middle"
            class="text-main" font-size="20">
            Nice to see you again
        </text>

        <use xlink:href="#logoLight" x="66" y="48"/>

        <!-- Inputs -->
        <g transform="translate(0,256)">
            <rect width="312" height="56" rx="12"
                fill="#FFFFFF" stroke="#9333EA" stroke-width="2"/>
            <text x="16" y="36" class="text-sub" font-size="16">Email</text>

            <g transform="translate(0,80)">
                <rect width="312" height="56" rx="12"
                    fill="#FFFFFF" stroke="#D1D5DB"/>
                <text x="16" y="36" class="text-sub" font-size="16">Password</text>
                <text x="288" y="36" text-anchor="middle"
                    class="text-sub" font-size="14">SHOW</text>
            </g>
        </g>

        <!-- Actions -->
        <g transform="translate(0,472)">
            <rect x="23" width="266" height="36" rx="8" fill="#FEE2E2"/>
            <text x="156" y="24" text-anchor="middle"
                class="text-error" font-size="14">
                Invalid email or password
            </text>

            <!-- Sign in -->
            <g transform="translate(0,52)">
                <rect x="23" width="266" height="50" rx="12"
                    fill="url(#btnLight)"/>
                <text x="156" y="32" text-anchor="middle"
                    fill="#FFFFFF" font-size="16">Sign in</text>
            </g>

            <!-- Register -->
            <g transform="translate(0,116)">
                <rect x="23" width="266" height="50" rx="12"
                    fill="#FFFFFF" stroke="#9333EA" stroke-width="2"/>
                <text x="156" y="32" text-anchor="middle"
                    class="primary" font-size="16">Register</text>
            </g>

            <!-- Google -->
            <g transform="translate(0,191)">
                <rect x="23" width="266" height="48" rx="12"
                    fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
                <use xlink:href="#googleIconLight" x="96" y="14"/>
                <text x="136" y="31"
                    class="text-main" font-size="14">
                    Sign in with Google
                </text>
            </g>
        </g>
    </g>
</svg>
