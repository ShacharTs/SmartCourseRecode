########################################
# Project-wide Gradle settings
########################################

# -------------------------------------------------
# Gradle daemon & memory discipline (CRITICAL)
# -------------------------------------------------

# Keep daemon on (faster builds, fewer JVM restarts)
org.gradle.daemon=true

# Do NOT allow parallel project execution (saves RAM)
org.gradle.parallel=false

# Hard limit on Gradle worker threads
org.gradle.workers.max=2

# Gradle JVM memory cap (DO NOT increase on 16GB RAM)
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8



# -------------------------------------------------
# Android / Kotlin settings
# -------------------------------------------------

# Required for modern Android projects
android.useAndroidX=true

# Kotlin official style
kotlin.code.style=official

# Non-transitive R classes (reduces memory + improves build times)
android.nonTransitiveRClass=true


# -------------------------------------------------
# Optional safety switches (leave enabled)
# -------------------------------------------------

# Avoid configuring unused projects eagerly
org.gradle.configureondemand=true

# Reduce filesystem watching overhead (Windows-friendly)
org.gradle.vfs.watch=false
